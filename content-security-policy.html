<!DOCTYPE html>
<html>
<head>


    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self'">

    <title>Content Security Policy</title>
</head>

<body>

    <h1>Exemplo de Content Security Policy</h1>

    <p>Esta página só permite imagens da própria pasta.</p>

    <img src="boso.jpg" width="500">

</body>
</html>
